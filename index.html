<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>콩스튜디오코리아 HR Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#111827;--mu:#4b5563;--ac:#1d4ed8;--bd:#cfd6e2;--up:#047857;--dn:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#171d29;--tx:#f3f4f6;--mu:#b6bdcc;--ac:#8fb0ff;--bd:#323b4f;--up:#34d399;--dn:#fb7185}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx)}
#login{max-width:340px;margin:20vh auto;padding:26px;background:var(--card);border:1px solid var(--bd);border-radius:14px;text-align:center}
input,select,button,a.btn{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#login input,#login button{width:100%;margin-top:10px}
button.p,a.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block}
@media(prefers-color-scheme:dark){button.p,a.btn{color:#0b0f17}}
#err{color:var(--dn);font-size:14px;min-height:20px;margin-top:8px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--card);border-bottom:2px solid var(--bd)}
header b{font-size:19px}header small{color:var(--mu)}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 18px}
nav button{white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){nav button.on{color:#0b0f17}}
main{padding:0 18px 36px;max-width:1150px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.kpi span{color:var(--mu);font-size:14px;font-weight:600}.kpi div{font-size:34px;font-weight:800;margin:2px 0}
.kpi small{color:var(--mu);font-size:12px;display:block}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:700;background:var(--bg);position:sticky;top:0}
tr.tot td{font-weight:800;background:var(--bg);border-bottom:2px solid var(--bd)}
.kpi div span{font-size:inherit;font-weight:inherit;color:inherit}.kpi div .up{color:var(--up)}.kpi div .dn{color:var(--dn)}
tr.div td{font-weight:800;cursor:pointer;background:var(--bg)}
td.n,th.n{text-align:right}.hide{display:none}
#login{max-width:430px;margin:9vh auto;padding:38px 32px 28px;border-radius:26px;text-align:center;box-shadow:0 20px 50px rgba(30,60,120,.15)}
.lh{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}.logo{height:48px;width:auto;display:block}.lt{text-align:left;line-height:1.25}.lt span{display:block;font-size:14px;font-weight:700;color:var(--mu)}.lt b{font-size:24px}
.hb{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}.hb .logo{height:32px}
#login .brand{margin-top:16px;color:#2f80ff;font-weight:800;font-size:13px;letter-spacing:.08em}
#login h1{margin:14px 0 8px;font-size:28px;line-height:1.3}
#login .sub{margin:0 0 24px;color:var(--mu)}
#login label{display:block;text-align:left;font-weight:700;font-size:14px;color:var(--mu)}
.pwbox{display:flex;align-items:center;border:1px solid var(--bd);border-radius:14px;margin-top:8px;padding-right:6px;background:var(--card)}
.pwbox input{flex:1;border:0;background:transparent;margin:0!important;padding:14px 12px;font-size:16px;outline:0;width:auto!important}
#eye{width:auto!important;margin:0!important;border:0;background:transparent;cursor:pointer;font-size:18px}
#login button.p{margin-top:18px;padding:15px;font-size:17px;font-weight:800;border-radius:14px;background:#2f80ff;color:#fff;box-shadow:0 8px 20px rgba(47,128,255,.3)}
#login .note{margin:14px 0 0;font-size:12px;color:var(--mu)}
td.wr{white-space:normal;min-width:150px}
.pill.g{background:#d1fae5;color:#065f46}tr.pend td{background:rgba(245,158,11,.14)}
.tg{margin-left:10px;font-size:13px;font-weight:400}.tg button{padding:3px 11px;font-size:13px;cursor:pointer;margin-right:4px}.tg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{text-align:center}.sep{border-left:3px solid var(--ac)!important}th.grp{text-align:center;font-weight:800;color:var(--tx);background:var(--bg)}.ct th,.ct td{text-align:center}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.pill.w{background:#fef3c7;color:#92400e}.pill.r{background:#fee2e2;color:#991b1b}
</style>
</head>

<script>
// ▼ Apps Script 웹 앱 URL(…/exec)을 아래 따옴표 안에 붙여넣으세요
const API_URL = 'https://script.google.com/macros/s/AKfycbxIlFNg7SvwYqatND2Cjsxly7gtiPlytHRmJTFrXBMMtYAUealo6P2mGkNGn6xnmeZwiw/exec';
const DETAIL_URL = 'https://docs.google.com/spreadsheets/d/1JN_ochVXMmX8KCRtqDYzbkm-GezNuLWRIydfD9uZKmI/edit?gid=46510504#gid=46510504';
const TABS = ['요약','월별 HC','조직','휴직','예정·알림','퇴사'];
const PAL = ['#2563eb','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'];
let D=null, charts=[];
const $ = id => document.getElementById(id);
let goDiv='';
const goTab=t=>[...$('nav').children].find(b=>b.textContent===t).click();
const goOrg=d=>{goDiv=d;goTab('조직');};
const num = v => Number(String(v||'').replace(/[^0-9.\-]/g,''))||0;
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uniq = (a,k) => [...new Set(a.map(r=>r[k]).filter(Boolean))];
const sgn = n => n>0?`<span class="up">+${n}</span>`:n<0?`<span class="dn">${n}</span>`:'0';

async function login(pw){
  if(!API_URL||API_URL.includes('여기에')){$('err').textContent='웹 앱 주소가 설정되지 않았습니다. index.html의 API_URL에 주소를 넣어주세요.';return;}
  $('err').textContent='확인 중…';
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({password:pw})});
    const j=await r.json();
    if(!j.ok){$('err').textContent=j.error==='locked'?'시도 횟수 초과. 10분 후 다시 시도하세요.':'비밀번호가 올바르지 않습니다.';return;}
    D=j.data; try{sessionStorage.setItem('pw',pw);}catch(e){}
    $('login').classList.add('hide');$('app').classList.remove('hide');init();
  }catch(e){$('err').textContent='서버 연결 오류. 웹 앱 주소(API_URL)와 배포 설정을 확인해 주세요.';}
}
$('eye').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password';};
$('go').onclick=()=>login($('pw').value);
$('pw').onkeydown=e=>{if(e.key==='Enter')login($('pw').value);};
try{const s=sessionStorage.getItem('pw');if(s)login(s);}catch(e){}

function init(){
  $('hlogo').src=$('logo').src;
  const hc=D['01_HC_Monthly']||[],l=hc[hc.length-1];
  $('upd').textContent=l&&l['갱신일']?'갱신 '+l['갱신일']:'';
  Chart.defaults.color=getComputedStyle(document.body).color;
  Chart.defaults.font.size=13;
  $('nav').innerHTML='';
  TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(t,b);$('nav').appendChild(b);if(i===0)show(t,b);});
}
function show(t,b){
  [...$('nav').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
  killCharts();const m=$('main');m.innerHTML='';
  ({'요약':m=>{summary(m);copyCard(m);},'월별 HC':hcTab,'조직':org,'휴직':leave,'예정·알림':sched,'퇴사':off})[t](m);
}
function killCharts(){charts.forEach(c=>c.destroy());charts=[];}
function card(m,title,html){const d=document.createElement('div');d.className='card';d.innerHTML=(title?`<h3>${title}</h3>`:'')+(html||'');m.appendChild(d);return d;}
function latestOrg(){const o=D['02_Organization_HC']||[];const mo=o.map(r=>r['기준월']).filter(Boolean).sort().pop();return mo?o.filter(r=>r['기준월']===mo):o;}

function pie(host,labels,vals){
  const cv=host.querySelector('canvas');
  charts.push(new Chart(cv,{type:'doughnut',data:{labels:labels.map((l,i)=>`${l}  ${vals[i]}명`),datasets:[{data:vals,backgroundColor:PAL,borderWidth:0}]},
    options:{cutout:'55%',plugins:{legend:{position:'right',labels:{boxWidth:14,font:{size:14}}}}}}));
}
function hbar(host,labels,vals,click){
  const cv=host.querySelector('canvas');let w=cv.parentElement;
  if(!w.dataset.hb){w=document.createElement('div');w.dataset.hb='1';w.style.position='relative';cv.parentNode.insertBefore(w,cv);w.appendChild(cv);}
  w.style.height=Math.max(200,labels.length*30+50)+'px';
  const o={indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{precision:0}},y:{ticks:{autoSkip:false}}}};
  if(click){o.onClick=(e,el)=>{if(el.length)click(labels[el[0].index]);};o.onHover=(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default';};}
  charts.push(new Chart(cv,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'#2563eb'}]},options:o}));
}

/* 추이 그래프 (꺾은선 ↔ 막대 전환) */
function trend(host,title,labels,series){
  const c=card(host,`${title} <span class="tg"><button type="button" data-t="line">꺾은선</button><button type="button" data-t="bar">막대</button></span>`,'<canvas height="110"></canvas>');
  let ch=null;
  const draw=t=>{
    if(ch){ch.destroy();charts=charts.filter(x=>x!==ch);}
    ch=new Chart(c.querySelector('canvas'),{type:t,data:{labels,datasets:series.map(s=>({label:s.label,data:s.data,borderColor:s.color,backgroundColor:s.color,tension:.3,pointRadius:4,pointHoverRadius:6,borderWidth:t==='line'?3:0}))},
      options:{layout:{padding:{left:14,right:18,top:8}},plugins:{legend:{display:series.length>1}},
        scales:{x:{offset:true,grid:{display:false},ticks:{padding:8}},y:{beginAtZero:t==='bar'||series.length>1,grace:t==='line'?'10%':0,ticks:{precision:0,padding:10}}}}});
    charts.push(ch);
    c.querySelectorAll('.tg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  };

}

/* 1. 요약 */
function summary(m){
  const org=latestOrg(),hc=D['01_HC_Monthly']||[],l=hc[hc.length-1];
  const cur=org.reduce((s,r)=>s+num(r['현재 HC']),0),prev=org.reduce((s,r)=>s+num(r['전월말 HC']),0),lv=(D['04_Longterm_Leave']||[]).length;
  const sn=leaveSoon(),up=sn.filter(x=>x.n>=0),od=sn.filter(x=>x.n<0);
  const sc=D['07_Schedule']||[],has=sc.length>0;

  const leaveAll=has?sc.filter(x=>x['구분']==='퇴사예정').length:SC(org,'퇴사예정자');
  const tile=(t,n,sub)=>`<div class="kpi" data-go="1" style="cursor:pointer"><span>${t}</span><div>${n}명</div><small>${sub}</small></div>`;
  const al=card(m,'🔔 예정·알림 <small style="color:var(--mu);font-weight:400">(클릭하면 예정·알림 탭으로 이동)</small>',`<div class="kpis" style="margin:0">${tile('복직 예정',up.length,od.length?`30일 이내 · 만료 지남 ${od.length}명`:'30일 이내')}${tile('입사 예정',has?c30('입사예정'):hireAll,has?`30일 이내 · 전체 ${hireAll}명`:'전체 예정 인원')}${tile('퇴사 예정',has?c30('퇴사예정'):leaveAll,has?`30일 이내 · 전체 ${leaveAll}명`:'전체 예정 인원')}${has?tile('계약 만료',c30('계약만료'),'30일 이내 · 계약직·파견직'):''}</div>`);
  al.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>goTab('예정·알림'));
  m.insertAdjacentHTML('beforeend',`<div class="kpis" style="margin-top:4px">
   <div class="kpi"><span>현재 재직자수</span><div>${cur}명</div><small>won과 임재환님 제외 / 파견직 포함</small></div>
   <div class="kpi"><span>실제 근무인원</span><div>${cur-lv}명</div><small>현재 재직자수 − 휴직자 ${lv}명</small></div>
   <div class="kpi"><span>전월말 대비</span><div>${sgn(cur-prev)}</div><small>전월말 ${prev}명</small></div>
   ${l?`<div class="kpi"><span>신규입사자</span><div>${esc(l['신규입사자'])}</div></div><div class="kpi"><span>퇴사자</span><div>${esc(l['퇴사자'])}</div><small>말일 퇴사자 미포함</small></div>`:''}</div>`);
  const g=document.createElement('div');g.className='grid';m.appendChild(g);empCard(g);divCard(g,org);
  if(!hc.length)return;
  const lb=hc.map(r=>r['기준월']);

  trend(m,'월별 입사·퇴사',lb,[{label:'입사',data:hc.map(r=>num(r['신규입사자'])),color:'#2563eb'},{label:'퇴사',data:hc.map(r=>num(r['퇴사자'])),color:'#ef4444'}]);
}

/* 날짜 / D-Day (열 때마다 오늘 기준으로 계산) */
const pd=t=>{const m=String(t||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;};
const dday=t=>{const e=pd(t);if(e===null)return null;const n=new Date(),td=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((e-td)/864e5);};
const ddTxt=(t,fb)=>{const d=dday(t);return d===null?(fb||'-'):d>0?'D-'+d:d===0?'D-Day':'종료 (복직 확인 필요)';};
const leaveSoon=()=>(D['04_Longterm_Leave']||[]).map(x=>({...x,n:dday(x['휴직만료일'])})).filter(x=>x.n!==null&&x.n<=30).sort((a,b)=>a.n-b.n);

/* 예정·알림 탭 */
function sched(m){
  const sn=leaveSoon();
  const pill=n=>n<0?'<span class="pill r">만료 지남</span>':n<=7?'<span class="pill r">7일 이내</span>':'<span class="pill w">30일 이내</span>';
  card(m,`복직 예정 (30일 이내 · 만료 지난 분 포함 ${sn.length}명)`,sn.length?`<div class="tw"><table><thead><tr><th>순번</th><th>이름</th><th>Division</th><th>Team</th><th>휴직종류</th><th>휴직만료일</th><th>D-Day</th><th>알림</th></tr></thead><tbody>${sn.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x['이름'])}</td><td>${esc(x['Division'])}</td><td>${esc(x['Team'])}</td><td>${esc(x['휴직종류'])}</td><td>${esc(x['휴직만료일'])}</td><td>${ddTxt(x['휴직만료일'])}</td><td>${pill(x.n)}</td></tr>`).join('')}</tbody></table></div>`:'30일 이내 복직 예정자가 없습니다.');
  const sc=D['07_Schedule']||[];
  if(sc.length){schedTables(m,sc);return;}
  const org=latestOrg(),ex=[];
  org.forEach(r=>String(r['퇴사예정자']||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='-').forEach(n=>ex.push({n,d:r['Division'],t:r['Team']})));
  card(m,`퇴사 예정 (${ex.length}명)`,(ex.length?`<div class="tw"><table><thead><tr><th>순번</th><th>이름</th><th>Division</th><th>Team</th></tr></thead><tbody>${ex.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${esc(x.d)}</td><td>${esc(x.t)}</td></tr>`).join('')}</tbody></table></div>`:'퇴사 예정자가 없습니다.')+'<p style="color:var(--mu);font-size:13px;margin:10px 0 0">※ 퇴사 예정일은 현재 시트에 없어 날짜는 표시되지 않습니다.</p>');
  const HK=hk(org),hr=[];
  if(HK)org.forEach(r=>String(r['입사예정자']||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='-').forEach(n=>hr.push({n,d:r['Division'],t:r['Team']})));
  if(HK)card(m,`입사 예정 (${hr.length}명)`,(hr.length?`<div class="tw"><table><thead><tr><th>순번</th><th>이름</th><th>Division</th><th>Team</th></tr></thead><tbody>${hr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${esc(x.d)}</td><td>${esc(x.t)}</td></tr>`).join('')}</tbody></table></div>`:'입사 예정자가 없습니다.')+'<p style="color:var(--mu);font-size:13px;margin:10px 0 0">※ 입사 예정자는 재직자수에 포함되지 않습니다.</p>');
  else{const nt=org.filter(r=>String(r['특이사항']||'').trim());
  card(m,'특이사항',nt.length?`<div class="tw"><table><thead><tr><th>Division</th><th>Team</th><th>특이사항</th></tr></thead><tbody>${nt.map(r=>`<tr><td>${esc(r['Division'])}</td><td>${esc(r['Team'])}</td><td class="wr">${esc(r['특이사항'])}</td></tr>`).join('')}</tbody></table></div>`:'입력된 특이사항이 없습니다.');}
}

/* 입사·퇴사·계약만료 예정 (날짜 포함, 07_Schedule 시트) */
function schedTables(m,sc){
  const ddp=(t,past)=>{const d=dday(t);return d===null?'날짜 미확인':d>0?'D-'+d:d===0?'D-Day':past;};
  const pl=t=>{const d=dday(t);return d===null?'':d<0?'<span class="pill r">기간 경과</span>':d<=7?'<span class="pill r">7일 이내</span>':d<=30?'<span class="pill w">30일 이내</span>':'';};
  [['입사예정','입사 예정','입사일 경과','※ 입사 예정자는 재직자수에 포함되지 않습니다.',false],
   ['퇴사예정','퇴사 예정','퇴사일 경과','※ 퇴사 예정자는 퇴사일 전까지 재직자수에 포함됩니다.',false],
   ['계약만료','계약 만료 예정 (계약직·파견직, 30일 이내)','만료일 경과','※ 계약직(인턴 포함)·파견직의 계약만료일 기준이며, 최근 30일 안에 만료일이 지난 분도 함께 표시됩니다.',true]
  ].forEach(([k,t,past,note,ex])=>{
    let r=sc.filter(x=>x['구분']===k);
    if(ex)r=r.filter(x=>{const d=dday(x['예정일']);return d!==null&&d>=-30&&d<=30;});
    r.sort((a,b)=>(pd(a['예정일'])??9e15)-(pd(b['예정일'])??9e15));
    card(m,`${t} (${r.length}명)`,(r.length?`<div class="tw"><table><thead><tr><th>순번</th><th>이름</th><th>Division</th><th>Team</th>${ex?'<th>구분</th>':''}<th>${ex?'계약만료일':'예정일'}</th><th>D-Day</th><th>알림</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x['이름'])}</td><td>${esc(x['Division'])}</td><td>${esc(x['Team'])}</td>${ex?`<td>${esc(({'계약직':'계약','계약직(인턴)':'계약','파견직':'파견'})[x['고용형태']]||x['고용형태'])}</td>`:''}<td>${esc(x['예정일']||'-')}</td><td>${ddp(x['예정일'],past)}</td><td>${pl(x['예정일'])}</td></tr>`).join('')}</tbody></table></div>`:'해당자가 없습니다.')+`<p style="color:var(--mu);font-size:13px;margin:10px 0 0">${note}</p>`);
  });
}

/* 3. 조직 */
const cnt=v=>String(v||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='-').length;
const hk=rows=>rows.some(r=>'입사예정자' in r);
const SC=(a,k)=>a.reduce((s,r)=>s+cnt(r[k]),0);
const nm=v=>{const n=cnt(v);return n?`${n}명 (${esc(String(v).trim())})`:'-';};
function org(m){
  const rows=latestOrg();let open=new Set();
  card(m,'조직별 인원 (Division ▸ Team)',`<div class="bar"><select id="fd"><option value="">Division 전체</option>${uniq(rows,'Division').map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="ft" placeholder="Team 검색"><button id="ea">전체 펼치기/접기</button></div><div class="tw" id="ot"></div>`);
  const draw=()=>{
    const fd=$('fd').value,ft=$('ft').value.trim().toLowerCase();
    const g={};rows.forEach(r=>{if(fd&&r['Division']!==fd)return;if(ft&&!String(r['Team']).toLowerCase().includes(ft))return;(g[r['Division']]=g[r['Division']]||[]).push(r);});
    const S=(a,k)=>a.reduce((s,r)=>s+num(r[k]),0);
    const HK=hk(rows);
    const c3=(x,y,z)=>`<td class="n">${x}</td><td class="n">${y}</td><td class="n">${z}</td>`;
    const c3b=(a,b,c)=>`<td class="c sep">${a}</td><td class="c">${b}</td><td class="c">${c}</td>`;
    let h='<table><thead><tr><th rowspan="2">Division / Team</th><th class="grp" colspan="3">인원 현황</th><th class="grp sep" colspan="3">휴직 · 예정 현황</th></tr><tr><th class="n">현재 HC</th><th class="n">전월말 HC</th><th class="n">차이</th><th class="c sep">당월 HC 포함 휴직자</th><th class="c">당월 HC 포함 퇴사예정자</th><th class="c">'+(HK?'입사예정자 (HC 미포함)':'특이사항')+'</th></tr></thead><tbody>';
    const A=[].concat(...Object.values(g));
    h+=`<tr class="tot"><td>전체 (${A.length}개 Team)</td>${c3(S(A,'현재 HC'),S(A,'전월말 HC'),sgn(S(A,'차이')))}${c3b(SC(A,'휴직자')+'명',SC(A,'퇴사예정자')+'명',HK?SC(A,'입사예정자')+'명':'')}</tr>`;
    Object.keys(g).forEach(dv=>{const a=g[dv],o=ft||fd||open.has(dv);
      h+=`<tr class="div" data-d="${esc(dv)}"><td>${o?'▾':'▸'} ${esc(dv)}</td>${c3(S(a,'현재 HC'),S(a,'전월말 HC'),sgn(S(a,'차이')))}${c3b(SC(a,'휴직자')+'명',SC(a,'퇴사예정자')+'명',HK?SC(a,'입사예정자')+'명':'')}</tr>`;
      if(o)a.forEach(r=>{h+=`<tr><td style="padding-left:28px">${esc(r['Team'])}</td>${c3(esc(r['현재 HC']),esc(r['전월말 HC']),sgn(num(r['차이'])))}<td class="wr c sep">${nm(r['휴직자'])}</td><td class="wr c">${nm(r['퇴사예정자'])}</td><td class="wr c">${HK?nm(r['입사예정자']):esc(r['특이사항'])}</td></tr>`;});});
    $('ot').innerHTML=h+'</tbody></table>';
    $('ot').querySelectorAll('tr.div').forEach(tr=>tr.onclick=()=>{const d=tr.dataset.d;open.has(d)?open.delete(d):open.add(d);draw();});
  };
  $('fd').onchange=draw;$('ft').oninput=draw;
  $('ea').onclick=()=>{const all=uniq(rows,'Division');open=open.size?new Set():new Set(all);draw();};
  if(goDiv){$('fd').value=goDiv;goDiv='';}
  draw();
}

/* 고용형태 (요약 탭) */

  const h=D['01_HC_Monthly'];
  trend(m,'월말 재직자 추이',h.map(x=>x['기준월']),[{label:'재직자수',data:h.map(x=>num(x['월말 재직자수'])),color:'#2563eb'}]);
  card(m,'월별 HC (최신순)',`<div class="tw"><table class="ct"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr${x['데이터구분']==='잠정'?' class="pend"':''}>`+cols.map(c=>c==='전월대비'?`<td>${sgn(num(x[c]))}</td>`:c==='데이터구분'?`<td><span class="pill ${x[c]==='잠정'?'w':'g'}">${x[c]==='잠정'?'잠정(미정)':esc(x[c])}</span></td>`:`<td>${esc(x[c])}</td>`).join('')+'</tr>').join('')}</tbody></table></div><small style="color:var(--mu)">말일 퇴사자는 재직자수에 포함 / 파견직 포함<br>잠정(미정)은 월말 확정 전 수치입니다.</small>`);
}

/* 5. 휴직 */
function leave(m){
  const r=(D['04_Longterm_Leave']||[]).map(x=>({...x,'복직 D-Day':ddTxt(x['휴직만료일'],x['복직 D-Day'])}));
  card(m,`당월 휴직중 (${r.length}명)`,tbl(r,['이름','Division','Team','휴직종류','휴직시작일','휴직만료일','복직 D-Day'],true));
  const o={};r.forEach(x=>{const d=x['Division']||'미지정';o[d]=(o[d]||0)+1;});
  const e=Object.entries(o).sort((a,b)=>b[1]-a[1]);
  if(e.length)card(m,'Division별 휴직 인원',`<div class="tw"><table><thead><tr><th>Division</th><th class="n">인원</th></tr></thead><tbody>${e.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${x[1]}명</td></tr>`).join('')}<tr class="div"><td>합계</td><td class="n">${r.length}명</td></tr></tbody></table></div>`);
}
function tbl(r,cols,idx){
  if(!r.length)return '데이터가 없습니다.';
  return `<div class="tw"><table><thead><tr>${idx?'<th>순번</th>':''}${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${r.map((x,i)=>'<tr>'+(idx?`<td>${i+1}</td>`:'')+cols.map(c=>`<td${c==='퇴사사유 세부'?' class="wr"':''}>${esc(x[c])}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
}

/* 6. 퇴사 */
function off(m){
  const all=D['05_Offboarding']||[];
  const F=[['연도','연도'],['퇴사월','퇴사월'],['소속','소속'],['퇴사사유','퇴사사유']];
  card(m,'',`<div class="bar">${F.map(([k,t])=>`<select data-k="${k}"><option value="">${t} 전체</option>${uniq(all,k).sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select>`).join('')}<input id="fn" placeholder="성명 검색"><a class="btn" href="${DETAIL_URL}" target="_blank" rel="noopener">상세 사유 보기 ↗</a></div>`);
  const g=document.createElement('div');g.className='grid';
  g.innerHTML='<div class="card"><h3>퇴사사유</h3><canvas height="200"></canvas></div><div class="card"><h3>소속별 퇴사자</h3><canvas height="200"></canvas></div>';
  m.appendChild(g);const lst=card(m,'','');
  const draw=()=>{
    killCharts();
    const f={};m.querySelectorAll('select[data-k]').forEach(s=>f[s.dataset.k]=s.value);
    const q=$('fn').value.trim();
    const r=all.filter(x=>Object.keys(f).every(k=>!f[k]||x[k]===f[k])&&(!q||String(x['성명']).includes(q)));
    const cnt=k=>{const o={};r.forEach(x=>{const v=x[k]||'미기재';o[v]=(o[v]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
    const a=cnt('퇴사사유'),b=cnt('소속'),cs=g.querySelectorAll('.card');
    pie(cs[0],a.map(x=>x[0]),a.map(x=>x[1]));hbar(cs[1],b.map(x=>x[0]),b.map(x=>x[1]));
    lst.innerHTML=`<h3>퇴사자 리스트 (${r.length}명)</h3>`+tbl(r,['퇴사일','성명','소속','팀','퇴사사유','퇴사사유 세부']);
  };
  m.querySelectorAll('select[data-k]').forEach(s=>s.onchange=draw);$('fn').oninput=draw;draw();
}
</script>
</body>
</html>
