<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>콩스튜디오코리아 HR Dashboard</title>
<script>try{if(sessionStorage.getItem('pw'))document.documentElement.className='auto'}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f2f4f6;--card:#fff;--tx:#191f28;--mu:#8b95a1;--ac:#2f80ff;--acs:#eaf2ff;--bd:#e5e8eb;--up:#4e5968;--dn:#f04452}
@media(prefers-color-scheme:dark){:root{--bg:#101318;--card:#1a1e26;--tx:#f2f4f6;--mu:#9aa4b2;--ac:#5b9dff;--acs:#1c2a44;--bd:#2c323c;--up:#c4cbd6;--dn:#ff6b78}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
input,select,button,a.btn{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p,a.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block;font-weight:600}
@media(prefers-color-scheme:dark){button.p,a.btn{color:#0b0f17}}
.hide{display:none}
/* 로그인 */
#login{max-width:430px;margin:9vh auto;padding:38px 32px 28px;background:var(--card);border:1px solid var(--bd);border-radius:26px;text-align:center;box-shadow:0 20px 50px rgba(30,60,120,.12)}
#login input,#login button{width:100%;margin-top:10px}
#err{color:var(--dn);font-size:14px;min-height:20px;margin-top:8px}
.lh{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}.logo{height:48px;width:auto;display:block}
.lt{text-align:left;line-height:1.25}.lt span{display:block;font-size:14px;font-weight:700;color:var(--mu)}.lt b{font-size:24px}
#login .sub{margin:0 0 24px;color:var(--mu)}
#login label{display:block;text-align:left;font-weight:700;font-size:14px;color:var(--mu)}
.pwbox{display:flex;align-items:center;border:1px solid var(--bd);border-radius:14px;margin-top:8px;padding-right:6px;background:var(--card)}
.pwbox input{flex:1;border:0;background:transparent;margin:0!important;padding:14px 12px;font-size:16px;outline:0;width:auto!important}
#eye{width:auto!important;margin:0!important;border:0;background:transparent;cursor:pointer;font-size:18px}
#login button.p{margin-top:18px;padding:15px;font-size:17px;font-weight:800;border-radius:14px;background:#2f80ff;color:#fff;box-shadow:0 8px 20px rgba(47,128,255,.3)}
#login .note{margin:14px 0 0;font-size:12px;color:var(--mu)}
.auto #login{display:none}
#boot{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:var(--bg);color:var(--mu);font-weight:600;z-index:99}
.auto #boot{display:flex}
/* 상단 바 */
#app:not(.hide){display:block;min-height:100vh}
#topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--card);border-bottom:1px solid var(--bd)}
.tl{display:flex;align-items:center;gap:14px}.tl .logo{height:34px}
.tt b{display:block;font-size:17px;font-weight:800;line-height:1.2}.tt span{font-size:12px;color:var(--mu)}
.trr{display:flex;gap:10px}
.ob{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;font-weight:600;font-size:13.5px;cursor:pointer}
.ob svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ob:disabled{opacity:.6;cursor:wait}
/* 사이드바 */
#body{display:flex;align-items:flex-start}
#side{width:262px;flex:none;position:sticky;top:64px;height:calc(100vh - 100px);overflow-y:auto;background:var(--card);border-right:1px solid var(--bd);padding:26px 16px 40px}
.se{color:var(--ac);font-weight:800;font-size:11px;letter-spacing:.14em}
.sh{font-size:22px;font-weight:800;margin:2px 0 18px;letter-spacing:-.02em}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;border-radius:12px;cursor:pointer;color:var(--tx)}
#nav button:hover{background:var(--bg)}
#nav button svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav button .ic{width:22px;height:22px}#nav button .chev{width:16px;height:16px;color:var(--mu)}
#nav button .tx{flex:1;min-width:0}
#nav button b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
#nav button small{display:block;font-size:11px;color:var(--mu);font-weight:500;margin-top:2px}
#nav button.on{background:var(--acs);color:var(--ac)}
#nav button.on small,#nav button.on .chev{color:var(--ac)}
/* 본문 */
#content{flex:1;min-width:0;padding-bottom:70px}
#ph{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;padding:26px 32px 14px;max-width:1280px;margin:0 auto;position:relative;z-index:30}
.eb{color:var(--ac);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
#ph h1{margin:3px 0 0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.pr{display:flex;align-items:center;gap:12px}
.asof{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:7px 14px}
.asof svg{width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.asof small{display:block;font-size:11px;color:var(--mu);line-height:1.2}.asof b{font-size:13px;line-height:1.3}
.lk{position:relative}
#lkb{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.25)}
@media(prefers-color-scheme:dark){#lkb{color:#0b0f17}}
#lkm{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:260px;z-index:60;box-shadow:0 14px 34px rgba(0,0,0,.2)}
#lkm a{display:block;padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}#lkm a:hover{background:var(--bg)}#lkm small{display:block;color:var(--mu);font-size:12px;font-weight:400}
#content main{max-width:1280px;margin:0 auto;padding:0 32px 24px}
#foot{position:fixed;left:0;right:0;bottom:0;height:36px;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:flex-end;align-items:center;gap:20px;padding:0 24px;font-size:12px;color:var(--mu);z-index:45}
.stk{position:sticky;top:64px;z-index:20;background:var(--bg);padding-top:6px;box-shadow:0 8px 8px -8px rgba(0,0,0,.18)}.stk .card{margin-bottom:8px}
/* 카드 · 표 */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 24px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.card h3 small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.grid>.card{margin-bottom:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600;background:var(--bg)}
tr.tot td{font-weight:800;background:var(--bg);border-bottom:2px solid var(--bd)}
tr.div td{font-weight:800;cursor:pointer;background:var(--bg)}
td.n,th.n{text-align:right}td.wr{white-space:normal;min-width:150px}
.c{text-align:center}.sep{border-left:2px solid var(--bd)!important}th.grp{text-align:center;font-weight:800;color:var(--tx);background:var(--bg)}.ct th,.ct td{text-align:center}
tr td.g2,tr th.g2{background:rgba(100,116,139,.09)!important}
.up{color:var(--up)}.dn{color:var(--dn)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.pill.w{background:var(--acs);color:var(--ac)}.pill.r{background:#ffe9eb;color:#d9303e}.pill.g{background:var(--bg);color:#4e5968}
@media(prefers-color-scheme:dark){.pill.r{background:#3a1d22;color:#ff8a94}.pill.g{color:#c4cbd6}}
tr.pend td{background:rgba(139,149,161,.12)}
.tg{margin-left:10px;font-size:13px;font-weight:400}.tg button{padding:3px 11px;font-size:13px;cursor:pointer;margin-right:4px}.tg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* KPI 카드 */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
.kpi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px}
.kpi em{width:34px;height:34px;flex:none;color:var(--ac);display:flex;align-items:center;justify-content:center}
.kpi em svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kt{min-width:0}.kt>span{display:block;color:var(--mu);font-size:13px;font-weight:500}
.kt>b{display:block;font-size:32px;font-weight:800;line-height:1.15;margin:1px 0;letter-spacing:-.02em}
.kt>small{display:block;color:var(--mu);font-size:11.5px;line-height:1.35}
.card .kpi{background:var(--bg);border-radius:14px;padding:14px 16px}
/* 도넛 + 범례 */
.pw{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.pc{position:relative;width:190px;height:190px;flex:none}
.pcn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pcn b{font-size:28px;font-weight:800;line-height:1.1}.pcn span{font-size:12px;color:var(--mu)}
.pl{list-style:none;margin:0;padding:0;flex:1;min-width:230px}
.pl li{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px}
.pl i{width:10px;height:10px;border-radius:50%;flex:none}
.pl span{flex:1;font-weight:600}.pl em{font-style:normal;color:var(--mu);width:46px;text-align:right}.pl b{width:56px;text-align:right}
.cd{margin:0 0 14px;color:var(--mu);font-size:12.5px}
.cv{position:relative;height:260px}
.opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);margin:0 0 6px;cursor:pointer}.opt input{padding:0;width:auto}.opt small{font-size:11.5px}
.eb100{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.sgw{flex:1;min-width:280px;display:flex;height:46px;border-radius:12px;overflow:hidden;background:var(--bg)}
.sg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0;overflow:hidden}
/* 반응형 */
@media(max-width:1100px){.kpis{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
@media(max-width:860px){
  #body{flex-direction:column}
  #side{position:static;width:100%;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--bd)}
  .se,.sh{display:none}
  #nav{flex-direction:row;overflow-x:auto;gap:8px}
  #nav button{width:auto;white-space:nowrap;padding:10px 14px}#nav button small,#nav button .chev{display:none}
  #topbar{padding:0 12px}.ob span{display:none}.tt span{display:none}
  #ph{padding:20px 16px 12px}#ph h1{font-size:24px}#content main{padding:0 16px 24px}
  .stk{top:64px}
}

/* Monthly report and browser-native PDF export */
.mrhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mrnote{font-size:12px;color:var(--mu);line-height:1.6}
.mrstatus{font-size:12px;color:var(--mu);margin:10px 0}
.mrprinthead{display:none}
@page{size:A4 landscape;margin:12mm}
@media print{
 html,body{background:#fff!important;color:#191f28!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #topbar,#side,#foot,#ph,.mrcontrols,#login,#boot{display:none!important}
 #app,#body,#content,#content main{display:block!important;max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
 #main>.card:not(.mrreport),#main>.grid:not(.mrreport){display:none!important}
 .mrprinthead{display:block!important;margin-bottom:16px}
 .mrreport,.mrreport .card{border:0!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid;background:#fff!important;color:#191f28!important}
 .mrreport{padding:0!important}
 .mrreport .grid{grid-template-columns:1fr 1fr!important}
 .mrreport .kpis{grid-auto-flow:column!important}
 .mrreport .kpi{padding:10px!important}
 .mrreport .kt>b{font-size:22px!important}
 .mrreport table{font-size:10px!important}
 .mrreport th,.mrreport td{padding:5px!important}
 .mrreport canvas{max-height:220px!important}
 .mrnote,.mrreport .cd{color:#596579!important}
}
</style>
</head>

/* 날짜 / D-Day (열 때마다 오늘 기준으로 계산) */
const pd=t=>{const m=String(t||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;};
const dday=t=>{const e=pd(t);if(e===null)return null;const n=new Date(),td=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((e-td)/864e5);};
const ddTxt=(t,fb)=>{const d=dday(t);return d===null?(fb||'-'):d>0?'D-'+d:d===0?'D-Day':'종료 (복직 확인 필요)';};
const leaveSoon=()=>(D['04_Longterm_Leave']||[]).map(x=>({...x,n:dday(x['휴직만료일'])})).filter(x=>x.n!==null&&x.n<=30).sort((a,b)=>a.n-b.n);

  const sc=D['07_Schedule']||[];

/* 입사·퇴사·계약만료 예정 (날짜 포함, 07_Schedule 시트) */
function schedTables(m,sc){
  const ddp=(t,past)=>{const d=dday(t);return d===null?'날짜 미확인':d>0?'D-'+d:d===0?'D-Day':past;};
  const pl=t=>{const d=dday(t);return d===null?'':d<0?'<span class="pill r">기간 경과</span>':d<=7?'<span class="pill r">7일 이내</span>':d<=30?'<span class="pill w">30일 이내</span>':'';};
  [['입사예정','입사 예정','입사일 경과','※ 입사 예정자는 재직자수에 포함되지 않습니다.',false],
   ['퇴사예정','퇴사 예정','퇴사일 경과','※ 퇴사 예정자는 퇴사일 전까지 재직자수에 포함됩니다.',false],
   ['계약만료','계약 만료 예정 (계약직·파견직, 30일 이내)','만료일 경과','※ 계약직(인턴 포함)·파견직의 계약만료일 기준이며, 최근 30일 안에 만료일이 지난 분도 함께 표시됩니다.',true]
  ].forEach(([k,t,past,note,ex])=>{
    let r=sc.filter(x=>x['구분']===k);
    if(ex)r=r.filter(x=>{const d=dday(x['예정일']);return d!==null&&d>=-30&&d<=30;});
    r.sort((a,b)=>(pd(a['예정일'])??9e15)-(pd(b['예정일'])??9e15));
    card(m,`${t} (${r.length}명)`,(r.length?`<div class="tw"><table><thead><tr><th>순번</th><th>이름</th><th>Division</th><th>Team</th>${ex?'<th>구분</th>':''}<th>${ex?'계약만료일':'예정일'}</th><th>D-Day</th><th>알림</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x['이름'])}</td><td>${esc(x['Division'])}</td><td>${esc(x['Team'])}</td>${ex?`<td>${esc(({'계약직':'계약','계약직(인턴)':'계약','파견직':'파견'})[x['고용형태']]||x['고용형태'])}</td>`:''}<td>${esc(x['예정일']||'-')}</td><td>${ddp(x['예정일'],past)}</td><td>${pl(x['예정일'])}</td></tr>`).join('')}</tbody></table></div>`:'해당자가 없습니다.')+`<p style="color:var(--mu);font-size:13px;margin:10px 0 0">${note}</p>`);
  });
}

/* 월간 요약 문구 복사 (Slack 보고용) */

/* 3. 조직 */
const cnt=v=>String(v||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='-').length;
const hk=rows=>rows.some(r=>'입사예정자' in r);
const SC=(a,k)=>a.reduce((s,r)=>s+cnt(r[k]),0);
const nm=v=>{const n=cnt(v);return n?`${n}명 (${esc(String(v).trim())})`:'-';};
function org(m){
  const rows=latestOrg();let open=new Set();
  const dc=card(m,'Division별 증감 순위 <small style="color:var(--mu);font-weight:400">(전월말 대비 · 막대를 클릭하면 아래 표가 해당 Division으로 필터됩니다)</small>','<canvas height="170"></canvas>');
  card(m,'조직별 인원 (Division ▸ Team)',`<div class="bar"><select id="fd"><option value="">Division 전체</option>${uniq(rows,'Division').map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="ft" placeholder="Team 검색"><button id="ea">전체 펼치기/접기</button></div><div class="tw" id="ot"></div>`);
  const draw=()=>{
    const fd=$('fd').value,ft=$('ft').value.trim().toLowerCase();
    const g={};rows.forEach(r=>{if(fd&&r['Division']!==fd)return;if(ft&&!String(r['Team']).toLowerCase().includes(ft))return;(g[r['Division']]=g[r['Division']]||[]).push(r);});
    const S=(a,k)=>a.reduce((s,r)=>s+num(r[k]),0);
    const act=r=>num(r['현재 HC'])-cnt(r['휴직자']);
    const SA=a=>a.reduce((s,r)=>s+act(r),0);
    const HK=hk(rows);
    const c4=(x,y,z,w)=>`<td class="c">${x}</td><td class="c">${y}</td><td class="c">${z}</td><td class="c">${w}</td>`;
    const c3b=(a,b,c)=>`<td class="c sep g2">${a}</td><td class="c g2">${b}</td><td class="c g2">${c}</td>`;
    let h='<table><thead><tr><th rowspan="2">Division / Team</th><th class="grp" colspan="4">인원 현황</th><th class="grp sep g2" colspan="3">휴직 · 예정 현황</th></tr><tr><th class="c">현재 HC</th><th class="c">전월말 HC</th><th class="c">차이</th><th class="c">실근무자 HC</th><th class="c sep g2">당월 HC 포함 휴직자</th><th class="c g2">당월 HC 포함 퇴사예정자</th><th class="c g2">'+(HK?'입사예정자 (HC 미포함)':'특이사항')+'</th></tr></thead><tbody>';
    const A=[].concat(...Object.values(g));
    h+=`<tr class="tot"><td>전체 (${A.length}개 Team)</td>${c4(S(A,'현재 HC'),S(A,'전월말 HC'),sgn(S(A,'차이')),SA(A))}${c3b(SC(A,'휴직자')+'명',SC(A,'퇴사예정자')+'명',HK?SC(A,'입사예정자')+'명':'')}</tr>`;
    Object.keys(g).forEach(dv=>{const a=g[dv],o=ft||fd||open.has(dv);
      h+=`<tr class="div" data-d="${esc(dv)}"><td>${o?'▾':'▸'} ${esc(dv)}</td>${c4(S(a,'현재 HC'),S(a,'전월말 HC'),sgn(S(a,'차이')),SA(a))}${c3b(SC(a,'휴직자')+'명',SC(a,'퇴사예정자')+'명',HK?SC(a,'입사예정자')+'명':'')}</tr>`;
      if(o)a.forEach(r=>{h+=`<tr><td style="padding-left:28px">${esc(r['Team'])}</td>${c4(esc(r['현재 HC']),esc(r['전월말 HC']),sgn(num(r['차이'])),act(r))}<td class="wr c sep g2">${nm(r['휴직자'])}</td><td class="wr c g2">${nm(r['퇴사예정자'])}</td><td class="wr c g2">${HK?nm(r['입사예정자']):esc(r['특이사항'])}</td></tr>`;});});
    $('ot').innerHTML=h+'</tbody></table><small style="color:var(--mu)">실근무자 HC = 현재 HC − 휴직자</small>';
    $('ot').querySelectorAll('tr.div').forEach(tr=>tr.onclick=()=>{const d=tr.dataset.d;open.has(d)?open.delete(d):open.add(d);draw();});
  };
  $('fd').onchange=draw;$('ft').oninput=draw;
  $('ea').onclick=()=>{const all=uniq(rows,'Division');open=open.size?new Set():new Set(all);draw();};
  if(goDiv){$('fd').value=goDiv;goDiv='';}
  draw();
  const df={};rows.forEach(r=>{const d=r['Division']||'미지정';df[d]=(df[d]||0)+num(r['현재 HC'])-num(r['전월말 HC']);});
  const de=Object.entries(df).sort((a,b)=>b[1]-a[1]);
  hbar(dc,de.map(x=>x[0]),de.map(x=>x[1]),d=>{$('fd').value=d;draw();$('ot').scrollIntoView({behavior:'smooth',block:'start'});},de.map(x=>x[1]>0?ACC:x[1]<0?RED:'#c7ced8'));
}

/* 고용형태 (요약 탭) */

  const g=document.createElement('div');g.className='grid';
  g.innerHTML='<div class="card"><h3>퇴사사유</h3><canvas height="200"></canvas></div><div class="card"><h3>소속별 퇴사자</h3><canvas height="200"></canvas></div>';
  m.appendChild(g);const tr=card(m,'퇴사사유 월별 추이 <small style="color:var(--mu);font-weight:400">(상위 5개 사유, 나머지는 기타)</small>','<canvas height="110"></canvas>');const lst=card(m,'','');
  const draw=()=>{
    killCharts();
    const f={};m.querySelectorAll('select[data-k]').forEach(s=>f[s.dataset.k]=s.value);
    const q=$('fn').value.trim();
    const r=all.filter(x=>Object.keys(f).every(k=>!f[k]||x[k]===f[k])&&(!q||String(x['성명']).includes(q)));
    const cnt=k=>{const o={};r.forEach(x=>{const v=x[k]||'미기재';o[v]=(o[v]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
    const a=cnt('퇴사사유'),b=cnt('소속'),cs=g.querySelectorAll('.card');
    pie(cs[0],a.map(x=>x[0]),a.map(x=>x[1]));hbar(cs[1],b.map(x=>x[0]),b.map(x=>x[1]));
    const mo={},rc={};
    r.forEach(x=>{const k=x['집계월'];if(!k)return;const w=x['퇴사사유']||'미기재';(mo[k]=mo[k]||{})[w]=(mo[k][w]||0)+1;rc[w]=(rc[w]||0)+1;});
    const top=Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]),ks=Object.keys(mo).sort(),months=[];
    if(ks.length){let [y,mm]=ks[0].split('-').map(Number);const [ye,me]=ks[ks.length-1].split('-').map(Number);while(y<ye||(y===ye&&mm<=me)){months.push(y+'-'+('0'+mm).slice(-2));mm++;if(mm>12){mm=1;y++;}}}
    const ser=top.map(w=>({label:w,data:months.map(k=>(mo[k]||{})[w]||0)}));
    const etc=months.map(k=>Object.entries(mo[k]||{}).filter(([w])=>!top.includes(w)).reduce((t,[,n])=>t+n,0));
    if(etc.some(Boolean))ser.push({label:'기타',data:etc});
    if(months.length)stack(tr,months,ser);
    lst.innerHTML=`<h3>퇴사자 리스트 (${r.length}명)</h3>`+tbl(r,['퇴사일','집계월','성명','소속','팀','퇴사사유','퇴사사유 세부'])+`<p style="color:var(--mu);font-size:12px;margin:10px 0 0">※ 집계월은 퇴사일 +1일 기준입니다. 말일 퇴사자는 익월로 집계하며, 요약·월별 인원현황과 같은 기준입니다.</p>`;
  };
  m.querySelectorAll('select[data-k]').forEach(s=>s.onchange=draw);$('fn').oninput=draw;draw();
}

/* 7. 월간 HR 리포트: 기존 01/05/08 + 선택적 09 익명 조직 스냅샷 */
function mrMonth(t){return mkey(t);}
function mrExitMonth(t){
  const time=pd(t); if(time===null)return null;
  const date=new Date(time+86400000);return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0');
}
function mrReason(t){
  const v=String(t||'').trim();
  if(!v)return '미분류';
  if(v.includes('비자발')||INVOL.some(x=>v.includes(x)))return '비자발';
  if(v.includes('자발'))return '자발';
  return '미분류'; // No guessing based on unknown reason text
}
function mrPct(n,d){return d>0?(n/d*100).toFixed(1)+'%':'산출 불가';}
function mrTable(headers,rows){
  if(!rows.length)return '<p class="mrnote">집계 데이터가 없습니다.</p>';
  return '<div class="tw"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function monthlyReport(m){
  const hc=(D['01_HC_Monthly']||[]).filter(r=>mrMonth(r['기준월'])).slice().sort((a,b)=>mrMonth(a['기준월']).localeCompare(mrMonth(b['기준월'])));
  if(!hc.length){card(m,'월간 HR 리포트','01_HC_Monthly 데이터가 없습니다.');return;}
  const months=[...new Set(hc.map(r=>mrMonth(r['기준월'])))];
  let chosen=months[months.length-1];
  const controls=card(m,'',`<div class="mrhead mrcontrols"><div><b>분석 기준월</b> <select id="mrmonth">${months.map(x=>`<option value="${x}"${x===chosen?' selected':''}>${x}</option>`).join('')}</select></div><button type="button" class="p" id="mrpdf">PDF 저장 / 인쇄</button></div><p class="mrnote">당월은 잠정값으로 표시합니다. 브라우저의 인쇄 창에서 대상: PDF로 저장을 선택하세요. PDF는 표시 중인 월간 리포트만 출력합니다.</p>`);
  const report=card(m,'','');report.classList.add('mrreport');
  function draw(){
    killCharts();
    const row=hc.find(x=>mrMonth(x['기준월'])===chosen),index=months.indexOf(chosen),prior=index>0?hc.find(x=>mrMonth(x['기준월'])===months[index-1]):null;
    const end=num(row['월말 재직자수']),start=String(row['전월말 HC']||'').trim()!==''?num(row['전월말 HC']):null;
    const entered=num(row['신규입사자']),leftHC=num(row['퇴사자']),delta=start===null?null:end-start;
    const avg=start===null?null:(start+end)/2;
    const departures=(D['05_Offboarding']||[]).filter(x=>mrExitMonth(x['퇴사일'])===chosen);
    const other=avg===null?null:end-(start+entered-leftHC);
    const active=(D['08_ActiveHC']||[]).find(x=>mrMonth(x['기준월'])===chosen);
    const org=(D['09_Monthly_Org']||[]).filter(x=>mrMonth(x['기준월'])===chosen);
    const prevOrg=(D['09_Monthly_Org']||[]).filter(x=>mrMonth(x['기준월'])===months[index-1]);
    const summaryOrg=(arr)=>{
      const map={};arr.forEach(x=>{const d=x['Division']||'미지정';map[d]=(map[d]||0)+num(x['재직자수']);});return map;
    };
    const nowMap=summaryOrg(org),beforeMap=summaryOrg(prevOrg);
    const divs=[...new Set([...Object.keys(nowMap),...Object.keys(beforeMap)])].sort((a,b)=>(nowMap[b]||0)-(nowMap[a]||0));
    const reason={},tenure={},groups={},classification={자발:0,비자발:0,미분류:0};
    departures.forEach(x=>{
      const w=x['퇴사사유']||'미기재';reason[w]=(reason[w]||0)+1;
      const d=x['소속']||'미지정';groups[d]=(groups[d]||0)+1;
      classification[mrReason(w)]++;
      const hired=pd(x['입사일']),res=pd(x['퇴사일']);
      let key='입사일 미확인';
      if(hired!==null&&res!==null&&res>=hired){const years=(res-hired)/86400000/365.2425;key=years<1?'1년 미만':years<3?'1~3년':years<5?'3~5년':'5년 이상';}
      tenure[key]=(tenure[key]||0)+1;
    });
    const reasonRows=Object.entries(reason).sort((a,b)=>b[1]-a[1]);
    const groupRows=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    const tRows=['1년 미만','1~3년','3~5년','5년 이상','입사일 미확인'].filter(x=>tenure[x]).map(x=>[x,tenure[x],mrPct(tenure[x],departures.length)]);
    const leaveByOrg=org.reduce((sum,x)=>sum+num(x['휴직자수']),0);
    const status=row['데이터구분']==='잠정'?'잠정':'확정';
    const reconciled=departures.length===leftHC?'일치':'불일치 · 집계 원본 확인 필요';
    report.innerHTML=`<div class="mrprinthead"><h1>콩스튜디오코리아 월간 HR 리포트</h1><p>${esc(chosen)} · ${status}</p></div>
      <div class="mrhead"><div><div class="eb">MONTHLY HR REPORT</div><h2>${esc(chosen)} 인력 현황 <span class="pill ${status==='잠정'?'r':'g'}">${status}</span></h2></div><span class="mrnote">재직 및 퇴사 종합 분석</span></div>
      <div class="kpis">${kpi('users','월말 재직자',end+'명',start===null?'전월말 미확인':'전월 대비 '+(delta>0?'+':'')+delta+'명')}
      ${kpi('userplus','당월 입사자',entered+'명','01_HC_Monthly 기준')}
      ${kpi('userminus','당월 퇴사자',leftHC+'명','01_HC_Monthly 기준')}
      ${kpi('trend','월간 퇴사율',avg===null?'산출 불가':mrPct(leftHC,avg),'월초·월말 HC 평균 기준')}</div>
      <div class="grid"><div class="card"><h3>월간 인원 변동</h3>${mrTable(['구분','인원'],[['전월말 HC',start===null?'-':start+'명'],['입사자',entered+'명'],['퇴사자',leftHC+'명'],['기타 조정',other===null?'-':(other>0?'+':'')+other+'명'],['월말 HC',end+'명'],['실근무인원',active?num(active['실근무인원'])+'명':'확인 불가']])}</div>
      <div class="card"><h3>퇴사 집계 및 검증</h3>${mrTable(['항목','값'],[['퇴사자(면담 원본)',departures.length+'명'],['HC 퇴사자',leftHC+'명'],['원본 대조',reconciled],['자발(확인)',classification['자발']+'명'],['비자발(확인)',classification['비자발']+'명'],['분류 미확인',classification['미분류']+'명'],['휴직자',active?num(active['휴직자'])+'명':org.length?leaveByOrg+'명':'확인 불가']])}</div></div>
      <div class="grid"><div class="card"><h3>최근 12개월 입사·퇴사 추이</h3><div class="cv"><canvas id="mrtrend"></canvas></div></div>
      <div class="card"><h3>조직별 재직자 전월 대비</h3>${org.length&&prevOrg.length?mrTable(['Division','전월','당월','증감'],divs.map(d=>[d,beforeMap[d]||0,nowMap[d]||0,(nowMap[d]||0)-(beforeMap[d]||0)])):'<p class="mrnote">09_Monthly_Org에 전월·당월 데이터가 모두 있어야 조직별 비교가 표시됩니다.</p>'}</div></div>
      <div class="grid"><div class="card"><h3>퇴사 사유</h3>${mrTable(['사유','인원','비중'],reasonRows.map(([x,v])=>[x,v,mrPct(v,departures.length)]))}</div>
      <div class="card"><h3>퇴사자의 근속기간</h3>${mrTable(['기간','인원','비중'],tRows)}</div></div>
      <div class="card"><h3>조직별 퇴사 인원</h3>${mrTable(['소속','퇴사자','월말 재직자','참고 퇴사율'],groupRows.map(([d,n])=>[d,n,org.length?(nowMap[d]===undefined?'소속명 매칭 안 됨':nowMap[d]):'미제공',org.length&&nowMap[d]!==undefined&&beforeMap[d]!==undefined?mrPct(n,(nowMap[d]+beforeMap[d])/2):'산출 불가']))}<p class="mrnote">조직별 참고 퇴사율은 퇴직면담 소속명과 Division 명칭이 정확히 일치하는 경우에만 표시됩니다. 조직 이동자는 별도 고려되지 않습니다.</p></div>
      <div class="mrnote">기준: 퇴사 집계월=퇴사일 다음 날의 월(말일 퇴사 익월 반영). 퇴사율=01_HC_Monthly 퇴사자 ÷ (전월말 HC+당월말 HC)/2. 자발/비자발은 명시 키워드만 분류하며 그 밖은 미분류. 과거 데이터가 수정되면 재집계가 필요합니다. 개인식별 정보는 보고서에 출력하지 않습니다.</div>`;
    const last=hc.filter(x=>mrMonth(x['기준월'])<=chosen).slice(-12);
    const canvas=report.querySelector('#mrtrend');
    charts.push(new Chart(canvas,{type:'bar',data:{labels:last.map(x=>mrMonth(x['기준월'])),datasets:[
      {label:'입사',data:last.map(x=>num(x['신규입사자'])),backgroundColor:ACC},
      {label:'퇴사',data:last.map(x=>num(x['퇴사자'])),backgroundColor:RED}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}}));
  }
  controls.querySelector('#mrmonth').onchange=e=>{chosen=e.target.value;draw();};
  controls.querySelector('#mrpdf').onclick=()=>{
    const old=document.title;document.title='HR_Monthly_Report_'+chosen;
    window.print();document.title=old;
  };
  draw();
}
</script>
